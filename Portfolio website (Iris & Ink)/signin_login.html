<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris & Ink | Graphic Design Co.</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&family=Open+Sans:wght@400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            
            <li><a href="career.html">Career</a></li>
            <li><a href="contactus.html">Contact us</a></li>
            <li><a href="signin_login.html" class="active">Sign in/ Log in</a></li>
        </ul>
    </nav>

    <!-- Login Box -->
    <div class="login-container">
        <h1 class="login-title">Iris & Ink</h1>
        <p class="login-subtitle">Welcome</p>

        <div id="google-signin-btn">
            <button class="google-btn">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google Logo">
                Sign in with Google
            </button>
        </div>

        <div class="separator">
            <span>or</span>
        </div>

        <form class="login-form">
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
    </div>

    <footer class="main-footer">
    <hr class="section-divider">

    <div class="footer-top">
        <!-- Left: Nav Links -->
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="contactus.html">Contact us</a>
            <a href="career.html">Career</a>
            <a href="signin_login.html">Sign in/ Log in</a>
        </div>

        <!-- Right: Newsletter -->
        <div class="footer-newsletter">
            <h4>Subscribe to our newsletter</h4>
            <p>Monthly digest of what's new and exciting from us.</p>
            <div class="newsletter-form">
                <input type="email" placeholder="Email address">
                <button type="button">Subscribe</button>
            </div>
        </div>
    </div>

    <hr class="footer-divider">

    <div class="footer-bottom">
        <p>© 2026 Iris & Ink. All rights reserved.</p>
        <div class="footer-social">
            <a href="https://twitter.com" target="_blank"><img src="images/xlogo.png" alt="X"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="https://youtube.com" target="_blank"><img src="images/youtube.png" alt="X"></a>
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png" alt="Instagram"></a>

        </div>
    </div>
    </footer>

    <div id="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">
        <span class="toggle-icon" id="dark-mode-icon">🌙</span>
    </div>
    
<script src="script.js"></script>
</body>
</html>
